[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubby"
dynamic = ["version"]
description = "Encrypted, namespaced secret store for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "perlyer" }]
keywords = ["secrets", "encryption", "age", "cli", "ai-agents"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/perlyer/cubby"

[project.scripts]
cubby = "cubby_tool.cli:main"

[tool.hatch.version]
path = "cubby_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cubby_tool"]
